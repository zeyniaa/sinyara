[project]
name = "sinyara"
version = "0.1.0"
description = "Evidence-led Indonesian scam triage for messages, links and audio"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "tldextract>=5.1,<6", "idna>=3.10,<4", "numpy>=2.1,<3", "av>=14,<17"]

[project.optional-dependencies]
audio = ["faster-whisper>=1.1,<2", "torch>=2.8,<3"]
public = ["gradio>=6.30,<7", "spaces>=0.40", "transformers>=5.3,<6", "accelerate>=1.10,<2", "torch>=2.8,<3"]
eval = ["mlflow-skinny>=3,<4", "psutil>=6,<8"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests/python"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sinyara"]
